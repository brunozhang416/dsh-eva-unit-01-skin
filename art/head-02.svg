  <path d="M46 92H74L80 107H40Z" fill="#A81F30" stroke="#FF8A73" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M51 96H69L71 102H49Z" fill="#140306"/>
  <path d="M58 98h4v3h-4Z" fill="#FF6B1A"/>

