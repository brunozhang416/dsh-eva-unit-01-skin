  <circle cx="60" cy="105.8" r="2.2" fill="#FF7A1A"/>

  <!-- 07 "00" chest marking (vector strokes, no font) -->
  <path d="M41 101 44.5 101 45 105 44.5 109 41 109 40.5 105Z" stroke="#3D7EA6" stroke-width="1.2" stroke-linejoin="miter"/>
  <path d="M47 101 50.5 101 51 105 50.5 109 47 109 46.5 105Z" stroke="#3D7EA6" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- 08 short light-blue bob -->
  <path d="M60 3 82 8 90 26 91 47 88 62 82 68 76 54 72 47 48 47 44 54 38 68 32 62 29 47 30 26 38 8Z"
        fill="#7FC4E8" stroke="#3D7EA6" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- 09 pale calm face -->
  <path d="M60 16 76 20 84 33 83 49 78 62 70 71 60 78 50 71 42 62 37 49 36 33 44 20Z"
        fill="#F2E7DD" stroke="#C5AA96" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- 10 blunt fringe -->
  <path d="M38 33 42 18 52 13 60 16 68 13 78 18 82 33 76 35 70 31 64 35 58 31 52 35 46 31 41 36Z"
