  <path d="M60 28.5v13" stroke="#E9E2F5" stroke-width="1.5"/>
  <path d="M50 32.5 56.5 32.5M70 32.5 63.5 32.5" stroke="#B98BE0" stroke-width="1.5"/>
  <path d="M45.5 30.5h3v3h-3Z" fill="#050409" stroke="#FF6B1A" stroke-width="1.2"/>

  <!-- eye recess -->
  <path d="M43 41 77 41 73 66 47 66Z" fill="#050409" stroke="#2E2340" stroke-width="2" stroke-linejoin="miter"/>
