    <path d="M60 16 76 20 84 33 83 49 78 62 70 71 60 78 50 71 42 62 37 49 36 33 44 20Z"
          fill="#F2E7DD" stroke="#C5AA96" stroke-width="1.5" stroke-linejoin="miter"/>
    <path d="M38 33 42 18 52 13 60 16 68 13 78 18 82 33 76 35 70 31 64 35 58 31 52 35 46 31 41 36Z"
