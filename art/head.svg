  <!-- ambient HUD ticks -->
  <g stroke="#6B5F80" stroke-width="1.5" opacity=".5">
    <path d="M3 90h10M3 96h6M107 90h10M111 96h6M3 83h4M113 83h4"/>
  </g>

  <!-- rear fins -->
  <path d="M44 24 31 15 28 21 39 30Z" fill="#1A0B2E" stroke="#7A2FB0" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M76 24 89 15 92 21 81 30Z" fill="#1A0B2E" stroke="#7A2FB0" stroke-width="2" stroke-linejoin="miter"/>

  <!-- crest horn -->
  <path d="M54 25 64 23.5 67.5 1.5 60 3Z" fill="#7A2FB0" stroke="#B98BE0" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M58 22.5 63 22 65 8 62 8.5Z" fill="#4B1D7A"/>
  

  <!-- shoulders / bust -->
