  <path d="M60 67.5v6" stroke="#B98BE0" stroke-width="1"/>
  <g fill="#050409">
    <path d="M51 77 53.4 76.6 53.8 84.5 51.6 84.9Z"/>
    <path d="M55.2 76.6 57.6 76.2 58 84.1 55.8 84.5Z"/>
