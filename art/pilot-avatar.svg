<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Original nervous pilot bust: brown-haired boy in a white and blue plugsuit with red collar, round chest unit and two A10 nerve clips">
  <!-- 01 HUD corner ticks: faint on purpose, they vanish cleanly at 24px -->
  <g stroke="#6B5F80" stroke-width="1.5" opacity=".5" stroke-linecap="square">
    <path d="M4 24V9h15M116 24V9H101"/>
  </g>

  <!-- 02 blue side panels (shoulders / arms) -->
  <path d="M6 120 16 104 34 96 48 96 44 120Z" fill="#2F5FE0" stroke="#6FA8FF" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M114 120 104 104 86 96 72 96 76 120Z" fill="#2F5FE0" stroke="#6FA8FF" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M20 108 26 102 28 105 22 111Z" fill="#EAF0FA"/>
  <path d="M100 108 94 102 92 105 98 111Z" fill="#EAF0FA"/>
  <path d="M12 114 16 110M108 114 104 110" stroke="#6B7488" stroke-width="2"/>

  <!-- 03 white front torso plate -->
  <path d="M42 95H78L81 120H39Z" fill="#EAF0FA" stroke="#BFD8FF" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M42 97 39 120M78 97 81 120" stroke="#FF2D2D" stroke-width="2"/>

  <!-- 04 neck -->
  <path d="M53 70H67L70 93H50Z" fill="#DCC0AC" stroke="#B08A72" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M54 73H66" stroke="#C9A98F" stroke-width="2"/>

  <!-- 05 red collar ring + steel latch -->
  <path d="M46 83H74L79 95H41ZM53 86H67L68 91H52Z" fill="#FF2D2D" fill-rule="evenodd" stroke="#1A0B2E" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M57 92H63L62 96H58Z" fill="#6B7488" stroke="#BFD8FF" stroke-width="1.5"/>

  <!-- 06 round chest interface unit: dark bezel, orange ring, amber core -->
  <path d="M60 99 65 101.1 67 106.2 65 111.3 60 113.4 55 111.3 53 106.2 55 101.1Z"
        fill="#1A0B2E" stroke="#BFD8FF" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M60 102 63 103.2 64 106.2 63 109.2 60 110.4 57 109.2 56 106.2 57 103.2Z" fill="#FF6B1A"/>
  <circle cx="60" cy="106.2" r="2.3" fill="#FFB347"/>

  <!-- 07 "01" chest marking (vector strokes, no font) -->
  <path d="M44 102 48 102 48.5 106 48 110 44 110 43.5 106Z" stroke="#6B7488" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M51 110V102L49.5 103.5" stroke="#6B7488" stroke-width="2" stroke-linejoin="miter"/>

  <!-- 08 short dark-auburn hair, back mass -->
  <path d="M60 2 84 8 93 28 92 52 86 46 84 56 78 50 42 50 36 56 34 46 28 52 27 28 36 8Z"
        fill="#5C3323" stroke="#3F2116" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- 09 pale angular face -->
  <path d="M60 16 76 20 84 33 83 49 78 62 70 71 60 78 50 71 42 62 37 49 36 33 44 20Z"
        fill="#F0E2D4" stroke="#C9A98F" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- 10 ears -->
  <path d="M36 43 30 41 30 52 37 53Z" fill="#EAD3BF" stroke="#C9A98F" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M84 43 90 41 90 52 83 53Z" fill="#EAD3BF" stroke="#C9A98F" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M33 45V50M87 45V50" stroke="#C9A98F" stroke-width="1.5"/>

  <!-- 11 jagged fringe over the forehead -->
  <path d="M37 33 40 17 52 11 59 19 65 12 78 14 87 24 89 35 82 31 80 22 73 25 75 34 68 27 65 20 61 29 57 21 52 30 47 24 43 34Z"
        fill="#5C3323" stroke="#3F2116" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M45 19 53 14M67 15 77 19" stroke="#7C472C" stroke-width="2"/>

  <!-- 12 brows: inner ends dip, slightly uneven = hesitant -->
  <path d="M43 36.5 57 39.5" stroke="#3F2116" stroke-width="2.5" stroke-linecap="butt"/>
  <path d="M77 37 63 41.5" stroke="#3F2116" stroke-width="3" stroke-linecap="butt"/>

  <!-- 13 eyes: shorter whites, dark irises, hesitant stare -->
  <path d="M45 46 58 44.5 57.5 52.5 47 54Z" fill="#FFFBF4"/>
  <path d="M48.5 47.5 55.5 46.2 55.5 51.3 49 52.6Z" fill="#3A2418"/>
  <path d="M75 46 62 44.5 62.5 52.5 73 54Z" fill="#FFFBF4"/>
  <path d="M71.5 47.5 64.5 46.2 64.5 51.3 71 52.6Z" fill="#3A2418"/>

  <!-- 14 nose + small open, uncertain mouth -->
  <path d="M60 52V57L62.5 59.8" stroke="#C0917A" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M55.5 65.5 60 64.8 64.5 65.8 60 67.6Z" fill="#B5735C"/>

  <!-- 15 A10 nerve clips at the temples: white body, orange tip, steel antenna -->
  <path d="M29 29 39 26 45 36 37 44 28 40Z" fill="#EAF0FA" stroke="#6B7488" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M34 38 39 35 41 39 37 43Z" fill="#FF6B1A"/>
  <path d="M28 29 24 22M28 40 24 46" stroke="#6B7488" stroke-width="2.5"/>
  <path d="M91 29 81 26 75 36 83 44 92 40Z" fill="#EAF0FA" stroke="#6B7488" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M86 38 81 35 79 39 83 43Z" fill="#FF6B1A"/>
  <path d="M92 29 96 22M92 40 96 46" stroke="#6B7488" stroke-width="2.5"/>
</svg>
