<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" fill="none" role="img" aria-label="Original casual pilot illustration: brown-haired boy in a navy zip jacket and white tee, headphones around the neck and a blue cassette player in one hand">
