  <path d="M90 53.5v2M90 66.5v2M82.5 61h2M95.5 61h2" stroke="#8A6E6E" stroke-width="1.5"/>
  <path d="M97 58.5 104 56 106 63 99 65.5Z" fill="#8A6E6E" stroke="#3A1418" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M98.5 60 103 58.6" stroke="#FF6B1A" stroke-width="2"/>
