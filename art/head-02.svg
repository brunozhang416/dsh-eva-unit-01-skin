  </g>

  <!-- rear fins -->
  <path d="M44 24 31 15 28 21 39 30Z" fill="#2A0A10" stroke="#E2323F" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M76 24 89 15 92 21 81 30Z" fill="#2A0A10" stroke="#E2323F" stroke-width="2" stroke-linejoin="miter"/>

  <!-- crest horn -->
