  <path d="M46 92H74L80 107H40Z" fill="#4B1D7A" stroke="#B98BE0" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M51 96H69L71 102H49Z" fill="#050409"/>
  <path d="M58 98h4v3h-4Z" fill="#9DFF4A"/>

