<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Original Unit-01 style mecha head emblem">
  <defs>
    <linearGradient id="eva01HeadArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A2FB0"/>
