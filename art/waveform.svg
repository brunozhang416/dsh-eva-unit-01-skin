    <rect x="17" y="16" width="6" height="9" opacity=".55"/>
    <rect x="29" y="10" width="6" height="15"/>
    <rect x="41" y="19" width="6" height="6" opacity=".55"/>
    <rect x="53" y="5" width="6" height="20"/>
    <rect x="65" y="14" width="6" height="11" opacity=".7"/>
    <rect x="77" y="8" width="6" height="17"/>
    <rect x="89" y="21" width="6" height="4" opacity=".55"/>
    <rect x="101" y="6" width="6" height="19"/>
    <rect x="113" y="12" width="6" height="13" opacity=".7"/>
    <rect x="125" y="4" width="6" height="21"/>
    <rect x="137" y="17" width="6" height="8" opacity=".55"/>
    <rect x="149" y="11" width="6" height="14"/>
    <rect x="161" y="7" width="6" height="18" opacity=".85"/>
    <rect x="173" y="18" width="6" height="7" opacity=".55"/>
    <rect x="185" y="13" width="6" height="12"/>
