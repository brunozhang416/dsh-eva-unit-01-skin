    <path d="M63.6 75.9 66 75.6 66.2 83.3 64.2 83.6Z"/>
  </g>

  <!-- cable port -->
  <circle cx="90" cy="61" r="7" fill="#1A0B2E" stroke="#6B5F80" stroke-width="2"/>
  <circle cx="90" cy="61" r="2.8" fill="#FF6B1A"/>
  <path d="M90 53.5v2M90 66.5v2M82.5 61h2M95.5 61h2" stroke="#6B5F80" stroke-width="1.5"/>
  <path d="M97 58.5 104 56 106 63 99 65.5Z" fill="#6B5F80" stroke="#2E2340" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M98.5 60 103 58.6" stroke="#FF6B1A" stroke-width="2"/>
