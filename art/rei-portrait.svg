    <path d="M46 18 56 15M66 15 76 19" stroke="#BFD8FF" stroke-width="2"/>
    <path d="M43 38 57 38.5M77 38 63 38.5" stroke="#3D7EA6" stroke-width="2.2" stroke-linecap="butt"/>
    <path d="M45 46.5 58 45 57.5 52 47 53.5Z" fill="#FFFBF4"/>
    <path d="M48.5 48 55.5 46.8 55.5 51 49 52.2Z" fill="#C93A4B"/>
    <path d="M75 46.5 62 45 62.5 52 73 53.5Z" fill="#FFFBF4"/>
    <path d="M71.5 48 64.5 46.8 64.5 51 71 52.2Z" fill="#C93A4B"/>
    <path d="M60 52V57L62.5 59.8" stroke="#C0917A" stroke-width="2" stroke-linejoin="miter"/>
    <path d="M56 66H64" stroke="#B5735C" stroke-width="2" stroke-linecap="butt"/>
    <path d="M29 29 39 26 45 36 37 44 28 40Z" fill="#EDF3FA" stroke="#3D7EA6" stroke-width="2" stroke-linejoin="miter"/>
    <path d="M34 38 39 35 41 39 37 43Z" fill="#7FC4E8"/>
    <path d="M28 29 24 22M28 40 24 46" stroke="#6B7488" stroke-width="2.5"/>
    <path d="M91 29 81 26 75 36 83 44 92 40Z" fill="#EDF3FA" stroke="#3D7EA6" stroke-width="2" stroke-linejoin="miter"/>
    <path d="M86 38 81 35 79 39 83 43Z" fill="#7FC4E8"/>
    <path d="M92 29 96 22M92 40 96 46" stroke="#6B7488" stroke-width="2.5"/>
  </g>
</svg>
