<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Original Unit-02 style mecha head emblem recolour">
  <!-- original recolour of our own head.svg geometry for Unit-02 (palette swap only, no traced art) -->
  <defs>
    <linearGradient id="eva02HeadArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2323F"/>
