<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Unit-01 plugin icon">
  <!-- opaque base: reads as a chip at 24px -->
  <rect width="128" height="128" fill="#0A0612"/>
  <path d="M16 6H112L122 16V112L112 122H16L6 112V16Z" fill="#120A22" stroke="#2E2340" stroke-width="2" stroke-linejoin="miter"/>

  <!-- hazard corner accents -->
  <path d="M14 104 23 95 27 99 18 108Z" fill="#FFD400"/>
  <path d="M114 104 105 95 101 99 110 108Z" fill="#FFD400"/>

  <g transform="translate(4 8) scale(.94)">
  <!-- rear fin + crest horn -->
  <path d="M40 31 24 19 20 29 34 42Z" fill="#1A0B2E" stroke="#7A2FB0" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M54 25 71 20 86 2 72 6Z" fill="#7A2FB0" stroke="#B98BE0" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M59 23 68 20 75 9 70 10Z" fill="#4B1D7A"/>

  <!-- head shell -->
  <path d="M64 18 86 29 96 54 92 74 82 94 64 106 46 94 36 74 32 54 42 29Z"
        fill="#4B1D7A" stroke="#B98BE0" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M64 20 84 30 86 40 64 44 42 40 44 30Z" fill="#7A2FB0" stroke="#B98BE0" stroke-width="2" stroke-linejoin="miter"/>

  <!-- face recess -->
  <path d="M64 44 88 50 86 76 64 92 42 76 40 50Z" fill="#050409" stroke="#2E2340" stroke-width="3" stroke-linejoin="miter"/>

  <!-- right eye cover -->
  <path d="M64 44 88 50 86 76 64 92 63 68 64 55Z" fill="#4B1D7A" stroke="#B98BE0" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M70 55 81 58 80 73 70 79Z" fill="#7A2FB0"/>

  <!-- single eye -->
  <path d="M43 57 62 52 63 70 45 75Z" fill="#9DFF4A" stroke="#4DFFB0" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M44.5 59.5 61 54.5" stroke="#C6FF00" stroke-width="2.5"/>

  <!-- chin grille -->
  <g fill="#050409">
    <path d="M53 94 57 93 57 102 53.5 102.8Z"/>
    <path d="M60 93 64 92.6 64 101.6 60.4 102Z"/>
    <path d="M67 92.6 71 92.4 70.8 101.2 67.2 101.6Z"/>
  </g>

  <!-- cable port -->
  <circle cx="96" cy="63" r="8.5" fill="#1A0B2E" stroke="#6B5F80" stroke-width="3"/>
  <circle cx="96" cy="63" r="3.5" fill="#FF6B1A"/>
  <path d="M96 51.5v2.5M96 72v2.5M84.5 63H87M105 63h2.5" stroke="#6B5F80" stroke-width="2.5"/>
  </g>
</svg>
