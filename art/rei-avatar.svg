<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Original calm pilot avatar: short light-blue haired girl in a white plugsuit with ice-blue panels and red chest detail">
  <!-- 01 HUD corner ticks -->
  <g stroke="#6B5F80" stroke-width="1.5" opacity=".5" stroke-linecap="square">
    <path d="M4 24V9h15M116 24V9H101"/>
  </g>

  <!-- 02 ice-blue side panels -->
  <path d="M6 120 16 104 36 95 50 95 44 120Z" fill="#7FC4E8" stroke="#EDF3FA" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M114 120 104 104 84 95 70 95 76 120Z" fill="#7FC4E8" stroke="#EDF3FA" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M20 110 26 104 29 107 23 113Z" fill="#EDF3FA"/>
  <path d="M100 110 94 104 91 107 97 113Z" fill="#EDF3FA"/>
